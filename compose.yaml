services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: resconate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: resconate
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resconate -d resconate"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      target: frontend
      args:
        API_INTERNAL_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres-data:
